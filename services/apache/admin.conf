# Bastion — vhost de la console d'administration (port 8080, distinct du portail 2080).
# Sécurité : accès protégé par login admin. En production, restreindre ce port
# à l'interface de management (pare-feu / Require ip), pas au LAN des clients.
<VirtualHost *:8080>
    ServerName admin.proxyfibre.lan
    DocumentRoot /var/www/admin

    <Directory /var/www/admin>
        Options -Indexes +FollowSymLinks
        AllowOverride None
        DirectoryIndex login.php index.php
        # Durcissement : les clients du LAN captif ne doivent PAS atteindre l'admin.
        # On autorise tout SAUF le sous-réseau des clients (accès depuis le réseau
        # de management / WAN / tunnel SSH). Ajuster __LAN_NET__/__LAN_CIDR__ au besoin.
        <RequireAll>
            Require all granted
            Require not ip __LAN_NET__/__LAN_CIDR__
        </RequireAll>
    </Directory>

    # Ne jamais servir les fichiers internes (config, connexion base…).
    <Directory /var/www/admin/inc>
        Require all denied
    </Directory>

    # Médiathèque : images de l'intranet servies aussi ici (aperçus CMS).
    Alias /portal/intranet/uploads /var/www/html/portal/intranet/uploads
    <Directory /var/www/html/portal/intranet/uploads>
        Options -Indexes
        Require all granted
    </Directory>

    # Bannière PXE servie en même origine (voir vhost HTTPS pour le détail).
    Alias /pxe-banner.png /var/www/html/boot/menu-bg.png
    <Files "menu-bg.png">
        Require all granted
    </Files>

    ErrorLog  ${APACHE_LOG_DIR}/proxyfibre-admin-error.log
    CustomLog ${APACHE_LOG_DIR}/proxyfibre-admin-access.log combined
</VirtualHost>
