<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Hors connexion — Intranet</title>
  <link rel="icon" type="image/svg+xml" href="/portal/assets/bastion-icon.svg">
  <style>
    body{margin:0;min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;
      font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:#0f172a;color:#e2e8f0;text-align:center;padding:2rem}
    img{width:72px;height:72px;margin-bottom:1.4rem;opacity:.9}
    h1{font-size:1.4rem;margin:0 0 .5rem}
    p{color:#94a3b8;line-height:1.6;max-width:340px;margin:.3rem 0}
    button{margin-top:1.6rem;padding:.75rem 1.4rem;background:#0ea5e9;color:#04283a;font-weight:600;border:none;border-radius:10px;font-size:1rem;cursor:pointer}
    .dot{display:inline-block;width:9px;height:9px;border-radius:50%;background:#f87171;margin-right:.4rem;vertical-align:middle}
  </style>
</head>
<body>
  <img src="/portal/assets/bastion-icon.svg" alt="Bastion">
  <h1><span class="dot"></span>Hors connexion</h1>
  <p>Vous n'êtes pas connecté au réseau, ou votre session est fermée.</p>
  <p>Reconnectez-vous au Wi-Fi de votre site, puis réessayez.</p>
  <button onclick="location.reload()">Réessayer</button>
</body>
</html>
