# Bastion — serveur de temps NTP pour le réseau LAN.
# Déployé en /etc/chrony/conf.d/proxyfibre.conf
allow 192.168.182.0/24
# Sert l'heure même sans synchro Internet (source locale de secours).
local stratum 10

# ── Source amont : le serveur de temps Microsoft (cohérent avec un domaine Windows/AD). ──
# « prefer » : chrony se cale EN PRIORITÉ sur time.windows.com. Le pool Debian de
# /etc/chrony/chrony.conf reste actif en SECOURS : un contrôleur de domaine ne doit JAMAIS
# perdre l'heure — au-delà de ~5 min d'écart, Kerberos refuse toute authentification et tout
# le domaine tombe. « iburst » accélère la première synchronisation.
server time.windows.com iburst prefer
