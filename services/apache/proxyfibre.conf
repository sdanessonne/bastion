# Bastion — vhost Apache pour le portail FAS.
# Sert sur le port 2080 : OpenNDS réserve 80/443 pour l'interception captive,
# un FAS local doit donc utiliser un autre port.
<VirtualHost *:2080>
    DocumentRoot /var/www/html

    <Directory /var/www/html/portal>
        Options -Indexes +FollowSymLinks
        AllowOverride None
        Require all granted
        DirectoryIndex fas.php
    </Directory>

    ErrorLog  ${APACHE_LOG_DIR}/proxyfibre-error.log
    CustomLog ${APACHE_LOG_DIR}/proxyfibre-access.log combined
</VirtualHost>
