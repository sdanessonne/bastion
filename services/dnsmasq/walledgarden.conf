# Bastion — Walled garden : serveurs de mises à jour accessibles SANS authentification.
# dnsmasq ajoute automatiquement les IP résolues de ces domaines (et sous-domaines,
# CDN compris) à l'ensemble nftables @walledgarden d'OpenNDS, que les clients
# non authentifiés sont autorisés à joindre (règle « ip daddr @walledgarden accept »).
# Ainsi Windows Update et les dépôts Linux fonctionnent même avant connexion au portail.
#
# NB : c'est Bastion qui gère cette ligne (l'intégration native d'OpenNDS échoue
# car son rechargement de dnsmasq est incompatible avec Debian).
# — Serveurs de mise à jour (Windows + distributions Linux) —
nftset=/windowsupdate.com/update.microsoft.com/delivery.mp.microsoft.com/do.dsp.mp.microsoft.com/msdl.microsoft.com/packages.microsoft.com/microsoft.com/debian.org/ubuntu.com/fedoraproject.org/archlinux.org/opensuse.org/almalinux.org/rockylinux.org/canonical.com/ip#nds_filter#walledgarden

# — Serveurs de temps (NTP) : l'heure correcte est requise avant même la
#   validation des certificats HTTPS et l'authentification.
nftset=/pool.ntp.org/ntp.org/time.windows.com/time.nist.gov/time.apple.com/time.google.com/time.cloudflare.com/ntp.ubuntu.com/ip#nds_filter#walledgarden
