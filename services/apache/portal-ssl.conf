# Bastion — portail captif (FAS) en HTTPS sur le port 2443.
# OpenNDS (fas_secure_enabled=2) redirige les clients vers https://<LAN_IP>:2443/portal/fas.php
# Certificat auto-signé par défaut → avertissement navigateur (voir docs).
# Pour un rendu sans avertissement : utiliser un nom de domaine + certificat reconnu.
<VirtualHost *:2443>
    ServerName portail.proxyfibre.lan
    DocumentRoot /var/www/html

    SSLEngine on
    SSLCertificateFile    /etc/proxyfibre/bastion.crt
    SSLCertificateKeyFile /etc/proxyfibre/bastion.key

    # ── LA RACINE MÈNE AU PORTAIL ───────────────────────────────────────────
    # Sans cette règle, « https://<passerelle>:2443/ » servait /var/www/html,
    # donc l'index.html laissé par Debian : « Apache2 Debian Default Page ».
    # L'agent qui saisit l'adresse sans chemin — le cas courant — croyait la
    # passerelle en panne.
    RedirectMatch ^/$ /portal/fas.php

    # Supprimer l'index.html ne suffirait pas : la configuration Debian autorise
    # « Indexes » sur /var/www, et la racine afficherait alors le CONTENU du
    # répertoire à la place. On la ferme explicitement.
    <Directory /var/www/html>
        Options -Indexes +FollowSymLinks
        AllowOverride None
        Require all granted
    </Directory>

    <Directory /var/www/html/portal>
        Options -Indexes +FollowSymLinks
        AllowOverride None
        Require all granted
        DirectoryIndex fas.php
    </Directory>

    # ── POINT D'ENTRÉE DES POSTES DU DOMAINE ────────────────────────────────
    # La console d'administration (port 8443) est volontairement INTERDITE depuis le
    # réseau des postes. Or les postes doivent atteindre « api.php » pour remonter
    # leur inventaire et récupérer la vignette de l'écran de connexion : les appels
    # partaient dans le vide, sans message, et l'inventaire n'a jamais rien remonté.
    #
    # Ce seul fichier est donc republié ici, sur le port du portail — déjà joignable
    # par les postes, et prévu pour eux. Rien d'autre de /var/www/admin n'est exposé :
    # l'alias ne porte que sur ce chemin.
    #
    # « BASTION_API_POSTE » indique à api.php qu'il est appelé par cette voie ; il n'y
    # sert alors QUE les actions à jeton (poste.* et station.*) et refuse la branche
    # « administrateur connecté ». Les cookies ne distinguent pas les ports : sans ce
    # marqueur, un administrateur connecté à la console aurait ouvert toute l'API sur
    # le réseau des postes sans le savoir.
    Alias /api.php /var/www/admin/api.php
    <Location "/api.php">
        # « CGIPassAuth On » : sans elle, Apache ne transmet PAS l'en-tête
        # « Authorization » à PHP, et tout appel porteur d'un jeton repart en 401 —
        # exactement comme si le jeton était faux. Le vhost de la console la porte
        # déjà ; l'oublier ici rendait ce point d'entrée inutilisable.
        CGIPassAuth On
        SetEnv BASTION_API_POSTE 1
        Require all granted
    </Location>

    ErrorLog  ${APACHE_LOG_DIR}/proxyfibre-ssl-error.log
    CustomLog ${APACHE_LOG_DIR}/proxyfibre-ssl-access.log combined
</VirtualHost>
