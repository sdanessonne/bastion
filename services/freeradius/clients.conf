# Bastion — FreeRADIUS clients (généré depuis provisioning/config.env)
# CoovaChilli tourne sur la même machine et interroge RADIUS en localhost.

client localhost {
    ipaddr          = 127.0.0.1
    proto           = *
    secret          = ${RADIUS_SECRET}
    require_message_authenticator = no
    nas_type        = other
    shortname       = coova-chilli
}
