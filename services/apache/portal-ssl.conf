# Bastion — portail captif (FAS) en HTTPS sur le port 2443.
# OpenNDS (fas_secure_enabled=2) redirige les clients vers https://<LAN_IP>:2443/portal/fas.php
# Certificat auto-signé par défaut → avertissement navigateur (voir docs).
# Pour un rendu sans avertissement : utiliser un nom de domaine + certificat reconnu.
<VirtualHost *:2443>
    ServerName portail.proxyfibre.lan
    DocumentRoot /var/www/html

    SSLEngine on
    SSLCertificateFile    /etc/proxyfibre/bastion.crt
    SSLCertificateKeyFile /etc/proxyfibre/bastion.key

    # ── LA RACINE MÈNE AU PORTAIL ───────────────────────────────────────────
    # Sans cette règle, « https://<passerelle>:2443/ » servait /var/www/html,
    # donc l'index.html laissé par Debian : « Apache2 Debian Default Page ».
    # L'agent qui saisit l'adresse sans chemin — le cas courant — croyait la
    # passerelle en panne.
    RedirectMatch ^/$ /portal/fas.php

    # Supprimer l'index.html ne suffirait pas : la configuration Debian autorise
    # « Indexes » sur /var/www, et la racine afficherait alors le CONTENU du
    # répertoire à la place. On la ferme explicitement.
    <Directory /var/www/html>
        Options -Indexes +FollowSymLinks
        AllowOverride None
        Require all granted
    </Directory>

    <Directory /var/www/html/portal>
        Options -Indexes +FollowSymLinks
        AllowOverride None
        Require all granted
        DirectoryIndex fas.php
    </Directory>

    ErrorLog  ${APACHE_LOG_DIR}/proxyfibre-ssl-error.log
    CustomLog ${APACHE_LOG_DIR}/proxyfibre-ssl-access.log combined
</VirtualHost>
