#
# Drop-in systemd pour hostapd : /etc/systemd/system/hostapd.service.d/
#
# POURQUOI CE FICHIER EXISTE
#
# Au démarrage, hostapd reste parfois bloqué à l'état « COUNTRY_UPDATE » : il
# attend l'application du domaine réglementaire, ne l'obtient jamais, et
# n'atteint donc jamais « ENABLED ». Aucune balise n'est émise, le réseau
# BASTION disparaît de la liste des réseaux — et « systemctl is-active hostapd »
# répond « active ». Constaté le 2026-08-06 : le service tournait depuis 20
# minutes sans qu'aucun poste ne puisse voir le réseau.
#
# C'est le pire type de panne de ce projet : le service se déclare en bonne
# santé et ne fait rien. Un simple redémarrage du service suffit à le débloquer.
#
# On vérifie donc, après le démarrage, que la radio est RÉELLEMENT montée. Le
# seul signal fiable est la ligne « AP-ENABLED » du journal : hostapd n'expose
# pas d'interface de contrôle ici, et « iw dev » annonce « type AP » même quand
# le point d'accès est bloqué — il indique la configuration chargée, pas l'état
# de la radio.
#
# Si l'AP n'est pas montée dans les 40 secondes, on échoue volontairement :
# systemd relance alors le service, ce qui est précisément le geste qui répare.
# La limite de démarrage borne la boucle — si trois relances ne suffisent pas,
# le problème est ailleurs et le service part en échec, visible sur la page
# Services et dans les alertes.

[Unit]
StartLimitIntervalSec=300
StartLimitBurst=4

[Service]
ExecStartPost=/bin/sh -c 'i=0; while [ $i -lt 40 ]; do journalctl -u hostapd --since "-2 min" --no-pager 2>/dev/null | grep -q "AP-ENABLED" && exit 0; sleep 1; i=$((i+1)); done; echo "ECHEC: hostapd actif mais point d acces non monte (bloque a COUNTRY_UPDATE) - relance" >&2; exit 1'
Restart=on-failure
RestartSec=5
