# Bastion — vhost de la page de blocage. Les domaines filtrés résolvent vers la
# passerelle ; ce vhost (par défaut sur 80 et 443) sert la page d'information Bastion
# pour n'importe quel domaine demandé. En HTTPS, le certificat Bastion est présenté
# (le navigateur signalera une non-concordance de nom, inévitable sans MITM).

<VirtualHost *:80>
    ServerName bastion.block
    DocumentRoot /var/www/block
    <Directory /var/www/block>
        Require all granted
        FallbackResource /block.php
    </Directory>
    ErrorLog  ${APACHE_LOG_DIR}/proxyfibre-block-error.log
</VirtualHost>

<VirtualHost *:443>
    ServerName bastion.block
    DocumentRoot /var/www/block
    SSLEngine on
    SSLCertificateFile    /etc/proxyfibre/bastion.crt
    SSLCertificateKeyFile /etc/proxyfibre/bastion.key
    <Directory /var/www/block>
        Require all granted
        FallbackResource /block.php
    </Directory>
    ErrorLog  ${APACHE_LOG_DIR}/proxyfibre-block-ssl-error.log
</VirtualHost>
