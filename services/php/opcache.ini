; Bastion — cache de code compilé (OPcache).
;
; ── À QUOI SERT CE FICHIER ───────────────────────────────────────────────────
; Sans OPcache, PHP relit, analyse et recompile CHAQUE fichier à CHAQUE
; affichage pour produire exactement le même résultat que la fois précédente.
;
; Debian l'active par défaut, et le contrôle effectué sur la passerelle en
; service l'a confirmé. Ce fichier n'est donc pas une optimisation : c'est une
; GARANTIE. Une réinstallation, une image minimale ou un paquet retiré
; laisseraient la console deux à trois fois plus lente sans rien casser, sans
; message, et personne n'attribuerait la lenteur à une extension PHP.
; Le déploiement vérifie l'état réel après coup, et selftest.sh à chaque passage.

zend_extension=opcache

opcache.enable=1

; Le processus PHP en ligne de commande est de courte durée : y activer le cache
; coûterait la construction du cache sans jamais le réutiliser. Les scripts de
; maintenance seraient ralentis, pas accélérés.
opcache.enable_cli=0

; MESURE, et non supposition : sur la passerelle en service, OPcache était DÉJÀ
; actif (réglage Debian par défaut) avec 128 Mo, 53 fichiers en cache et 96,6 %
; de réussite. La compilation n'était donc pas la cause de la lenteur signalée.
; Ce fichier ne sert plus à accélérer quoi que ce soit sur cette machine — il
; garantit qu'une réinstallation ou une image minimale ne se retrouve pas SANS
; OPcache sans que personne s'en aperçoive.
; Les valeurs reprennent donc celles de Debian : les abaisser à « ce qui devrait
; suffire » aurait dégradé une configuration qui fonctionnait.
opcache.memory_consumption=128

; Chaînes partagées entre fichiers (noms de fonctions, de classes, littéraux).
opcache.interned_strings_buffer=8

; Nombre de fichiers suivis — valeur Debian conservée (le projet en utilise 53).
opcache.max_accelerated_files=16229

; ── POURQUOI LA REVALIDATION RESTE ACTIVE ────────────────────────────────────
; Avec « validate_timestamps=0 », PHP ne regarde JAMAIS si un fichier a changé :
; on déploie une correction, la console continue de servir l'ancien code, et
; rien ne le signale. On chercherait alors la panne dans le code neuf — qui
; n'est même pas exécuté. Ce piège a déjà coûté cher dans ce projet sous
; d'autres formes (un cache qui survit, une protection qui ne protège rien).
; Le contrôle de date coûte un « stat » toutes les deux secondes par fichier :
; négligeable au regard du risque.
opcache.validate_timestamps=1
opcache.revalidate_freq=2

; Les commentaires sont conservés : certaines bibliothèques lisent les blocs de
; documentation à l'exécution, et l'économie serait de quelques kilo-octets.
opcache.save_comments=1

; Recyclage automatique quand la mémoire perdue dépasse ce seuil.
opcache.max_wasted_percentage=10

; Journalise les erreurs d'OPcache dans le journal d'Apache, sans bavardage.
opcache.log_verbosity_level=1

; Le compilateur à la volée (JIT) n'est PAS activé : il apporte peu à une
; application web dominée par les entrées/sorties (base, commandes système),
; consomme de la mémoire — rare ici — et a connu des défauts subtils. Le gain
; réel se joue sur la compilation évitée, pas sur le JIT.
