# Préréglage (preseed) d'installation Debian avec CHIFFREMENT INTÉGRAL DU DISQUE (LUKS + LVM).
#
# La phrase secrète LUKS est DEMANDÉE À L'INSTALLATION (elle n'est PAS préréglée ici) : ce fichier
# est servi en clair sur le LAN → il ne contient AUCUN secret. Même logique que l'unattend Windows.
# Utilisé par l'entrée de menu PXE « Debian — installation chiffrée (LUKS) ».

# ── Langue / clavier / horloge ───────────────────────────────────────────────
d-i debian-installer/locale string fr_FR.UTF-8
d-i keyboard-configuration/xkb-keymap select fr(latin9)
d-i clock-setup/utc boolean true
d-i time/zone string Europe/Paris
d-i clock-setup/ntp boolean true

# ── Réseau : DHCP via la passerelle Bastion ──────────────────────────────────
d-i netcfg/choose_interface select auto
d-i netcfg/get_hostname string poste
d-i netcfg/get_domain string bastion.pn.int

# ── Partitionnement : disque ENTIER, LVM CHIFFRÉ (LUKS) ──────────────────────
# « method crypto » = LVM sur LUKS. La PHRASE SECRÈTE est demandée par l'installateur
# (partman-crypto/passphrase n'est volontairement PAS prérégle → rien de stocké).
d-i partman-auto/method string crypto
d-i partman-lvm/device_remove_lvm boolean true
d-i partman-md/device_remove_md boolean true
d-i partman-crypto/erase_disks boolean false
d-i partman-lvm/confirm boolean true
d-i partman-lvm/confirm_nooverwrite boolean true
d-i partman-auto-lvm/guided_size string max
d-i partman-auto/choose_recipe select atomic
d-i partman-crypto/confirm boolean true
d-i partman-crypto/confirm_nooverwrite boolean true
d-i partman-partitioning/confirm_write_new_label boolean true
d-i partman/choose_partition select finish
d-i partman/confirm boolean true
d-i partman/confirm_nooverwrite boolean true

# ── Amorceur GRUB ────────────────────────────────────────────────────────────
d-i grub-installer/only_debian boolean true
d-i grub-installer/bootdev string default

# ── Fin ──────────────────────────────────────────────────────────────────────
# Le compte utilisateur, le mot de passe root et le miroir restent demandés à l'écran
# (installation ASSISTÉE) : seul le partitionnement chiffré est automatisé.
d-i finish-install/reboot_in_progress note
