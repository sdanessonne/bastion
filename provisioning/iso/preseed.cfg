#
# Préréglage d'installation MUETTE de la passerelle Bastion, sur DISQUE CHIFFRÉ (LUKS + LVM),
# suivie du déploiement automatique depuis le dépôt Git.
#
# ── AVERTISSEMENT ────────────────────────────────────────────────────────────
# Ce fichier est un MODÈLE : les marqueurs __MDP_BASTION__, __MDP_ROOT__ et __LUKS__ sont
# remplacés par build-iso.sh au moment de fabriquer l'image. Une fois fabriquée, l'ISO
# CONTIENT CES SECRETS EN CLAIR : elle doit être conservée comme une clé (coffre, armoire
# forte), jamais déposée sur un partage ouvert ni envoyée par courriel. Quiconque la détient
# peut déchiffrer une passerelle installée avec.
# ─────────────────────────────────────────────────────────────────────────────

# ── Langue, clavier, horloge ────────────────────────────────────────────────
d-i debian-installer/locale string fr_FR.UTF-8
d-i keyboard-configuration/xkb-keymap select fr(latin9)
d-i clock-setup/utc boolean true
d-i time/zone string Europe/Paris
d-i clock-setup/ntp boolean true

# ── Réseau : DHCP, sans question ────────────────────────────────────────────
d-i netcfg/choose_interface select auto
d-i netcfg/get_hostname string bastion
d-i netcfg/get_domain string local
d-i netcfg/hostname string bastion
# Pas de réseau ? On continue quand même : le déploiement se fera à la main.
d-i netcfg/dhcp_failed note
d-i netcfg/dhcp_options select Configurer le réseau vous-même

# ── Miroir ──────────────────────────────────────────────────────────────────
d-i mirror/country string FR
d-i mirror/http/hostname string deb.debian.org
d-i mirror/http/directory string /debian
d-i mirror/http/proxy string

# ── Comptes ─────────────────────────────────────────────────────────────────
# Le compte root est VERROUILLÉ : on administre par sudo depuis ce compte.
#
# ── POURQUOI « proxyfibre » ET NON « BASTION » ──────────────────────────────
# Deux raisons, la première découverte en installant pour de vrai :
#
# 1. Debian REFUSE un identifiant en majuscules — « L'identifiant que vous avez
#    indiqué n'est pas valable. Les identifiants doivent commencer par une lettre
#    minuscule… ». L'installation muette s'arrêtait donc sur une question, ce qui
#    est exactement ce qu'elle est censée éviter.
#
# 2. Le code déployé attend le dépôt dans /home/proxyfibre/proxyFibre : ce chemin
#    est écrit en dur dans selfupdate.sh, selftest.sh et import-media.sh. Un compte
#    « bastion » aurait produit un serveur fonctionnel mais INCAPABLE de se mettre
#    à jour, et l'auto-test n'aurait rien trouvé à contrôler.
#
# « Bastion » reste le nom du produit, affiché partout dans la console ; les
# identifiants internes restent « proxyfibre ».
d-i passwd/root-login boolean false
d-i passwd/make-user boolean true
d-i passwd/user-fullname string Administration Bastion
d-i passwd/username string proxyfibre
d-i passwd/user-password password __MDP_BASTION__
d-i passwd/user-password-again password __MDP_BASTION__
d-i user-setup/allow-password-weak boolean true
d-i user-setup/encrypt-home boolean false

# ── Partitionnement : disque ENTIER, LVM CHIFFRÉ ────────────────────────────
d-i partman-auto/method string crypto
d-i partman-auto/disk string /dev/sda
d-i partman-lvm/device_remove_lvm boolean true
d-i partman-md/device_remove_md boolean true
d-i partman-crypto/erase_disks boolean false
d-i partman-lvm/confirm boolean true
d-i partman-lvm/confirm_nooverwrite boolean true
d-i partman-auto-lvm/guided_size string max
d-i partman-auto/choose_recipe select atomic
# Phrase secrète du disque : préréglée pour que l'installation soit MUETTE.
d-i partman-crypto/passphrase password __LUKS__
d-i partman-crypto/passphrase-again password __LUKS__
d-i partman-crypto/weak_passphrase boolean true
d-i partman-crypto/confirm boolean true
d-i partman-crypto/confirm_nooverwrite boolean true
d-i partman-partitioning/confirm_write_new_label boolean true
d-i partman/choose_partition select finish
d-i partman/confirm boolean true
d-i partman/confirm_nooverwrite boolean true

# ── Paquets : le strict nécessaire, deploy.sh installe le reste ─────────────
tasksel tasksel/first multiselect standard, ssh-server
d-i pkgsel/include string sudo git ca-certificates curl
d-i pkgsel/upgrade select full-upgrade
popularity-contest popularity-contest/participate boolean false

# ── Amorceur ────────────────────────────────────────────────────────────────
d-i grub-installer/only_debian boolean true
d-i grub-installer/bootdev string default

# ── Déploiement automatique de Bastion ──────────────────────────────────────
# On récupère le dépôt et on lance deploy.sh au premier démarrage (et non ici : dans
# l'installateur, le réseau et les services ne sont pas dans leur état définitif).
d-i preseed/late_command string \
      sh -c 'test -x /cdrom/bastion/copier.sh && sh /cdrom/bastion/copier.sh || true'; \
    in-target sh -c 'install -d -m755 /opt/bastion-init'; \
    in-target sh -c 'printf "%s\n" "#!/bin/sh" "set -e" \
      "test -d /home/proxyfibre/proxyFibre || git clone --depth 1 __DEPOT__ /home/proxyfibre/proxyFibre" \
      "chown -R proxyfibre:proxyfibre /home/proxyfibre/proxyFibre 2>/dev/null || true" \
      "cd /home/proxyfibre/proxyFibre && bash provisioning/deploy.sh >>/var/log/bastion-install.log 2>&1" \
      "bash /home/proxyfibre/proxyFibre/services/scripts/import-media.sh auto >>/var/log/bastion-install.log 2>&1 || true" \
      "systemctl disable bastion-init.service" > /opt/bastion-init/run.sh'; \
    in-target chmod +x /opt/bastion-init/run.sh; \
    in-target sh -c 'printf "%s\n" "[Unit]" "Description=Bastion - deploiement initial" \
      "After=network-online.target" "Wants=network-online.target" \
      "[Service]" "Type=oneshot" "ExecStart=/opt/bastion-init/run.sh" "RemainAfterExit=yes" \
      "[Install]" "WantedBy=multi-user.target" > /etc/systemd/system/bastion-init.service'; \
    in-target systemctl enable bastion-init.service

# ── Fin : redémarrage sans question ─────────────────────────────────────────
d-i finish-install/reboot_in_progress note
