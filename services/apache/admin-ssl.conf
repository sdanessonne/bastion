# Bastion — console d'administration en HTTPS (port 8443, certificat auto-signé).
<VirtualHost *:8443>
    ServerName admin.proxyfibre.lan
    DocumentRoot /var/www/admin

    SSLEngine on
    SSLCertificateFile    /etc/proxyfibre/bastion.crt
    SSLCertificateKeyFile /etc/proxyfibre/bastion.key

    <Directory /var/www/admin>
        Options -Indexes +FollowSymLinks
        AllowOverride None
        DirectoryIndex login.php index.php
        <RequireAll>
            Require all granted
            Require not ip __LAN_NET__/__LAN_CIDR__
        </RequireAll>
    </Directory>
    <Directory /var/www/admin/inc>
        Require all denied
    </Directory>

    # Médiathèque de l'intranet : sert les images (docroot du portail) pour les
    # aperçus dans la console CMS, au même chemin que sur le site.
    Alias /portal/intranet/uploads /var/www/html/portal/intranet/uploads
    <Directory /var/www/html/portal/intranet/uploads>
        Options -Indexes
        Require all granted
    </Directory>

    # Bannière PXE : servie en même origine (HTTPS) pour l'aperçu dans la console,
    # afin d'éviter le blocage « contenu mixte » (l'image réelle est sur le port 2080).
    Alias /pxe-banner.png /var/www/html/boot/menu-bg.png
    <Files "menu-bg.png">
        Require all granted
    </Files>

    ErrorLog  ${APACHE_LOG_DIR}/proxyfibre-admin-ssl-error.log
    CustomLog ${APACHE_LOG_DIR}/proxyfibre-admin-ssl-access.log combined
</VirtualHost>
