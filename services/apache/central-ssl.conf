# Bastion Central — console de supervision départementale en HTTPS (port 9443).
# À déployer sur la machine centrale dédiée. Certificat auto-signé (réutilise
# celui de l'admin pour la démo). Réserver ce port au réseau de management.
Listen 9443
<VirtualHost *:9443>
    ServerName central.proxyfibre.lan
    DocumentRoot /var/www/central

    SSLEngine on
    SSLCertificateFile    /etc/proxyfibre/admin.crt
    SSLCertificateKeyFile /etc/proxyfibre/admin.key

    <Directory /var/www/central>
        Options -Indexes +FollowSymLinks
        AllowOverride None
        DirectoryIndex login.php index.php
        Require all granted
    </Directory>
    <Directory /var/www/central/inc>
        Require all denied
    </Directory>

    ErrorLog  ${APACHE_LOG_DIR}/proxyfibre-central-error.log
    CustomLog ${APACHE_LOG_DIR}/proxyfibre-central-access.log combined
</VirtualHost>
