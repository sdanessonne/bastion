# Bastion — Serveur PXE (installation d'OS par le réseau).
# dnsmasq fait aussi office de serveur TFTP. Les clients qui démarrent en réseau
# reçoivent notre iPXE complet (avec HTTP + script embarqué), qui charge ensuite
# l'installateur via HTTP (port 2080) — robuste derrière le portail captif.

enable-tftp
tftp-root=/srv/tftp
# NB : « tftp-single-port » a été RETIRÉ. Il ne servait qu'un transfert TFTP à la fois :
# un transfert resté bloqué retardait tous les suivants de ~4 s et faisait échouer le PXE.
# À la place, le portail laisse passer le flux de données TFTP via conntrack (helper
# nf_conntrack_tftp + règle « established,related » dans ndsRTR, posés par
# walledgarden-refresh.sh). Transferts parallèles, réponse immédiate.

# iPXE (VirtualBox et cartes réseau modernes) : charger notre iPXE complet.
# Son script embarqué enchaîne : dhcp -> chain http://<LAN_IP>:2080/boot/boot.ipxe
#
# IMPORTANT — on sert « ipxe.pxe » et PAS « undionly.* ». Raison (constatée, pas théorique) :
# undionly réutilise la pile réseau UNDI de la ROM PXE. Chaîné depuis la ROM iPXE de
# VirtualBox, la RÉCEPTION est cassée : notre iPXE émet bien des DHCPDISCOVER (dnsmasq
# répond par des DHCPOFFER, visibles dans /var/log/proxyfibre-dns.log) mais ne reçoit
# JAMAIS l'offre → aucun DHCPREQUEST → « No configuration methods succeeded / DHCP failed ».
# Testé : .kpxe ET .kkpxe échouent tous les deux (le .kkpxe, censé corriger ce cas, échoue
# 3 fois sur 3). Seul ipxe.pxe règle le problème : il embarque ses PROPRES pilotes (e1000
# de VirtualBox inclus) et n'utilise pas l'UNDI. undionly.* restent dans /srv/tftp en repli.
dhcp-userclass=set:ipxe,iPXE
dhcp-boot=tag:ipxe,ipxe.pxe

# Clients non-iPXE : chargeur selon l'architecture (BIOS charge notre iPXE ;
# UEFI charge le chargeur EFI du netboot Debian).
dhcp-match=set:bios,option:client-arch,0
dhcp-match=set:efi64,option:client-arch,7
dhcp-match=set:efi64,option:client-arch,9
dhcp-boot=tag:bios,tag:!ipxe,ipxe.pxe
dhcp-boot=tag:efi64,tag:!ipxe,debian-installer/amd64/bootnetx64.efi

pxe-prompt="Bastion - demarrage reseau", 2
