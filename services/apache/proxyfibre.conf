# Bastion — vhost Apache pour le portail FAS.
# Sert sur le port 2080 : OpenNDS réserve 80/443 pour l'interception captive,
# un FAS local doit donc utiliser un autre port.
<VirtualHost *:2080>
    DocumentRoot /var/www/html

    # ── LA RACINE MÈNE AU PORTAIL ───────────────────────────────────────────
    # Sans cette règle, « https://<passerelle>:2080/ » servait /var/www/html,
    # donc l'index.html laissé par Debian : « Apache2 Debian Default Page ».
    # L'agent qui saisit l'adresse sans chemin — le cas courant — croyait la
    # passerelle en panne.
    RedirectMatch ^/$ /portal/fas.php

    # Supprimer l'index.html ne suffirait pas : la configuration Debian autorise
    # « Indexes » sur /var/www, et la racine afficherait alors le CONTENU du
    # répertoire à la place. On la ferme explicitement.
    <Directory /var/www/html>
        Options -Indexes +FollowSymLinks
        AllowOverride None
        Require all granted
    </Directory>

    <Directory /var/www/html/portal>
        Options -Indexes +FollowSymLinks
        AllowOverride None
        Require all granted
        DirectoryIndex fas.php
    </Directory>

    ErrorLog  ${APACHE_LOG_DIR}/proxyfibre-error.log
    CustomLog ${APACHE_LOG_DIR}/proxyfibre-access.log combined
</VirtualHost>
