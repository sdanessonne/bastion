# Bastion — dnsmasq : DHCP + DNS du LAN (déployé par provisioning)
# Avec OpenNDS (contrairement à CoovaChilli), c'est dnsmasq qui fournit le DHCP.

# N'écouter que sur l'interface LAN.
interface=__LAN_IF__
bind-interfaces
listen-address=__LAN_IP__

# ── DHCP pour les clients du LAN ─────────────────────────────────────────────
dhcp-range=__DHCP_START__,__DHCP_END__,__LAN_MASK__,1h
dhcp-option=option:router,__LAN_IP__
dhcp-option=option:dns-server,__LAN_IP__

# ── DNS ──────────────────────────────────────────────────────────────────────
no-resolv
server=9.9.9.9
server=1.1.1.1
cache-size=1000
domain-needed
bogus-priv
# Point d'application futur du filtrage DNS (pilier 2 / phase 3).
